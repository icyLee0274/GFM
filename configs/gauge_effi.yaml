hydra:
  run:
    dir: ../output/effi/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

target: [ linear, quadratic, soc, lmi]
repeat: 3

linear:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000]
  box: 10
  n_cons: [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

quadratic:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000]
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

soc:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000]
  mat_dim: 10
  box: 100
  n_cons:  [1]
  seed: 2021
  test_size: 10
  batch_size: [1]

# PSD
lmi:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000]
  mat_dim: 100
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]