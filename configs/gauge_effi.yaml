hydra:
  run:
    dir: ../output/effi/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

target: [ linear, quadratic, soc, lmi]
repeat: 2

linear:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000]
  box: 10
  n_cons: [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

quadratic:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000 ]
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

soc:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000]
  mat_dim: 100
  box: 10
  n_cons:  [1]
  seed: 2021
  test_size: 10
  batch_size: [1]

# PSD
lmi:
  dims: [10, 100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000]
  mat_dim: 100
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]