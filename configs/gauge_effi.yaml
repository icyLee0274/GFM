hydra:
  run:
    dir: ../output/effi/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

target: [ linear, quadratic, soc, lmi]
repeat: 3

linear:
  dims: [10,200,400,600,800,1000,1200,1400,1600,1800,2000,2200,2400,2600,2800,3000,]
  box: 10
  n_cons: [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

quadratic:
  dims: [10,200,400,600,800,1000,1200,1400,1600,1800,2000,2200,2400,2600,2800,3000,]
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]

soc:
  dims: [10,200,400,600,800,1000,1200,1400,1600,1800,2000,2200,2400,2600,2800,3000,]
  mat_dim: 1000
  box: 10
  n_cons:  [1]
  seed: 2021
  test_size: 10
  batch_size: [1]

# PSD
lmi:
  dims: [10,200,400,600,800,1000,1200,1400,1600,1800,2000,2200,2400,2600,2800,3000,]
  mat_dim: 100
  box: 10
  n_cons:  [1]
  seed: 2025
  test_size: 10
  batch_size: [1]